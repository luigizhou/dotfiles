# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g base-index 1
set -g renumber-windows on
set -g mouse on
set -g history-limit 10000
set -g display-time 4000
set -g escape-time 0
set -g focus-events on

# Status bar
set -g status-position top
set -g status-style "bg=#303446,fg=#c6d0f5"
set -g status-left "#[fg=#8caaee,bold] #S #[fg=#626880]│ "
set -g status-left-length 40
set -g status-right "#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#[fg=#626880]│ #[fg=#a6d189]%H:%M #[fg=#626880]│ #[fg=#99d1db]%d %b"
set -g status-right-length 60
set -g message-style "bg=#414559,fg=#c6d0f5"

# Window splits keep current path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-tmux-navigator)
bind -n C-h if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\S+\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\S+\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\S+\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\S+\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'" "send-keys C-l" "select-pane -R"
bind -n 'C-\' if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\S+\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'" "send-keys C-\\\\" "select-pane -l"

# Pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind -n M-h previous-window
bind -n M-l next-window
bind b last-window

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Copy mode (vi)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel pbcopy

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
